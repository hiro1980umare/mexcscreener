# =====================================================================
# criteria_v2b.yaml  --  V2b の事前登録基準（V2の基準 + V2b専用の追加の厳格化）
# =====================================================================
version: v2b
registered_on: "2026-10-08"
base: config/criteria_v2.yaml
base_sha256: 8fa9e30a8dfb02d3f9a329259566c0e919e28d1a0fc42aebf58baa2c8abc0957    # V2の事前登録基準。1文字も変更しない(ハッシュで固定)

# ★記録(D3の承認事項):
record: "V2の事前登録基準は変更しない。V2bはV2結果を見た後に設計された2回目のdev試行なので、偶然の合格を防ぐため、V2bのc2だけ97.5%区間という、より厳しい基準を追加する。95%→97.5%への変更は基準を緩めるものではなく、V2bに対する追加の厳格化である。"

# V2の基準に対する上書きは、これだけ。c1,c3,c4,c5,c6 とそれらの数値、主要検証(V2_A, 3m)、
# 二段階評価(Tier1/Tier2)、統計手法(ブロック・ブートストラップ)は、V2のまま。
overrides:
  bootstrap:
    ci: 0.975                  # c2(区間の下限が0超)の区間を 95% → 97.5% に厳格化(2回目のdev試行のBonferroni補正)

# ---- 最終検証へ進む条件（V2b実行前に固定）----
# V2は、devでTier1を満たさなかったので、最終検証の候補になれない。
# V2bが次の(a)(b)(c)をすべて満たした場合にだけ、V2bで最終検証を最大1回行う。
# 満たさなければ最終検証は行わず、封印のまま『優位性を示せなかった』と報告する。
selection:
  a: "V2b_A vs ALL_GATE が dev で c1・c3・c4・c5 を満たす(数値はV2と同じ)"
  b: "Qualityの上乗せ: V2b_A - T_HIGH_ONLY(同日内の差・3か月後・V2b_Aが10件以上ある日)の平均が 0 超"
  c: "c2(97.5%区間の下限が0超、かつ採用日数40日以上)を満たす"
  eligible_if: "a and b and c"
  final_use: "最大1回。使うルールは V2b のみ(V2は不適格)。最終検証でも c6(同じ符号)を満たさなければ成功と主張しない"

# ---- 事前登録する記述的な副次分析(選択基準には使わない) ----
secondary_descriptive:
  - "RSI<30(SIMPLE_RSI)のうち Quality HIGH と LOW の差(同日内で比較、各側3件以上の日だけ)"
  - "Timing高(v1判定A/B)のうち Quality HIGH と LOW の差(同上)"
  - "RSI<30 の件数が少ない(約4,200行/102日)ため、前者は検出力が低い。結論は『方向』の参考にとどめる"
